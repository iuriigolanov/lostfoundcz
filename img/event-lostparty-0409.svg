<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1a0a1a"/>
      <stop offset="55%" stop-color="#0a0510"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E030C0"/>
      <stop offset="100%" stop-color="#ff5ec8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowS" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="720" height="1280" fill="url(#bg)"/>

  <!-- LOST & FOUND логотип-текст -->
  <text x="360" y="430" font-family="Georgia,serif" font-size="52" font-weight="bold" fill="#ff6ec7" text-anchor="middle" filter="url(#glow)" letter-spacing="4">LOST &amp; FOUND</text>
  <text x="360" y="470" font-family="Arial,sans-serif" font-size="22" fill="#00C8E0" text-anchor="middle" filter="url(#glowS)" letter-spacing="10">COCKTAIL BAR</text>

  <!-- LOST PARTY -->
  <text x="360" y="600" font-family="Arial Black,Arial,sans-serif" font-size="90" font-weight="900" fill="url(#pink)" text-anchor="middle" filter="url(#glow)" letter-spacing="2">LOST PARTY</text>

  <!-- divider -->
  <line x1="180" y1="650" x2="540" y2="650" stroke="#444" stroke-width="1"/>

  <!-- FRIDAY 04.09 -->
  <text x="360" y="690" font-family="Arial,sans-serif" font-size="22" fill="#c9c9d4" text-anchor="middle" letter-spacing="8">FRIDAY</text>
  <text x="360" y="770" font-family="Arial Black,Arial,sans-serif" font-size="86" font-weight="900" fill="#ff6ec7" text-anchor="middle" filter="url(#glow)" letter-spacing="4">04.09</text>
  <text x="360" y="810" font-family="Arial,sans-serif" font-size="22" fill="#c9c9d4" text-anchor="middle" letter-spacing="4">START <tspan fill="#fff" font-weight="bold">20:00</tspan></text>

  <line x1="180" y1="840" x2="540" y2="840" stroke="#444" stroke-width="1"/>

  <!-- DJ SETS -->
  <text x="360" y="890" font-family="Arial,sans-serif" font-size="20" fill="#E030C0" text-anchor="middle" letter-spacing="6" font-weight="bold">DJ SETS:</text>
  <text x="360" y="925" font-family="Arial,sans-serif" font-size="26" fill="#f0f0f5" text-anchor="middle" letter-spacing="4">LEX MIRA</text>
  <text x="360" y="965" font-family="Arial,sans-serif" font-size="30" fill="#00C8E0" text-anchor="middle" letter-spacing="6" filter="url(#glowS)">SHØGUN</text>

  <!-- FREE ENTRY -->
  <text x="360" y="1030" font-family="Arial,sans-serif" font-size="28" fill="#00C8E0" text-anchor="middle" letter-spacing="8" font-weight="bold" filter="url(#glowS)">FREE ENTRY</text>

  <!-- address -->
  <text x="360" y="1090" font-family="Arial,sans-serif" font-size="18" fill="#8a8a95" text-anchor="middle" letter-spacing="2">ŽITNÁ 1764/11, PRAHA 1</text>
  <text x="360" y="1118" font-family="Arial,sans-serif" font-size="18" fill="#8a8a95" text-anchor="middle" letter-spacing="2">+420 724 188 537</text>

  <!-- umbrella accent -->
  <text x="360" y="360" font-size="40" text-anchor="middle">🍸</text>
</svg>